<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Reset your password</title>
</head>
<body style="margin:0;background:#f7f5f2;font-family:Arial,sans-serif;color:#252525">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center" style="padding:32px 16px">
        <table role="presentation" width="100%" style="max-width:560px;background:#fff;border-radius:16px;padding:32px">
          <tr>
            <td>
              <h1 style="margin:0 0 16px;font-size:26px">Reset your password</h1>
              <p>Hello {{name}},</p>
              <p>We received a request to reset your Latache password.</p>
              <p style="margin:28px 0">
                <a href="{{resetUrl}}" style="display:inline-block;padding:13px 20px;background:#111;color:#fff;text-decoration:none;border-radius:8px">Reset password</a>
              </p>
              <p>This link expires in {{expiryMinutes}} minutes and can be used only while the matching reset request remains active.</p>
              <p style="color:#6b6b6b;font-size:13px">If you did not request this, you can ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
