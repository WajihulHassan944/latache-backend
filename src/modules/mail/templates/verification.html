<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Verify your email</title>
</head>
<body style="margin:0;background:#f7f5f2;font-family:Arial,sans-serif;color:#252525">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center" style="padding:32px 16px">
        <table role="presentation" width="100%" style="max-width:560px;background:#fff;border-radius:16px;padding:32px">
          <tr>
            <td>
              <h1 style="margin:0 0 16px;font-size:26px">Verify your email</h1>
              <p>Hello {{name}},</p>
              <p>Use this one-time code to finish signing in on {{device}}:</p>
              <p style="font-size:34px;font-weight:700;letter-spacing:8px;margin:28px 0">{{otp}}</p>
              <p>This code expires in {{expiryMinutes}} minutes. Do not share it with anyone.</p>
              <p style="color:#6b6b6b;font-size:13px">If you did not request this, you can ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
