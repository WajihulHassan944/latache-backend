services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: latache
      POSTGRES_USER: latache
      POSTGRES_PASSWORD: latache
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latache -d latache"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - latache-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://latache:latache@postgres:5432/latache?schema=public}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_SECRET_ADMIN: ${JWT_SECRET_ADMIN:?JWT_SECRET_ADMIN must be set}
      PASSWORD_RESET_JWT_SECRET: ${PASSWORD_RESET_JWT_SECRET:?PASSWORD_RESET_JWT_SECRET must be set}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SWAGGER_ENABLED: "${SWAGGER_ENABLED:-true}"
      SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DOCKER_SMTP_PORT:-1025}
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-Latache <no-reply@latache.local>}"
      SMTP_VERIFY_ON_BOOTSTRAP: "${SMTP_VERIFY_ON_BOOTSTRAP:-true}"
    ports:
      - "8080:8080"
    command: ["sh", "-c", "npm run prisma:migrate:deploy && node --enable-source-maps dist/main.js"]

volumes:
  latache-postgres:
