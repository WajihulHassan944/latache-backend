services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - latache-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVICE_MODE: api
      PORT: 8080
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      REDIS_REQUIRED: "true"
      JOBS_ENABLED: "true"
      JOB_WORKER_ENABLED: "false"
      JOB_SCHEDULER_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    command:
      [
        "sh",
        "-c",
        "npm run prisma:migrate:deploy && node --enable-source-maps dist/main.js"
      ]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVICE_MODE: worker
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      REDIS_REQUIRED: "true"
      JOBS_ENABLED: "true"
      JOB_WORKER_ENABLED: "true"
      JOB_SCHEDULER_ENABLED: "false"
    command:
      [
        "node",
        "--enable-source-maps",
        "dist/main.js"
      ]

volumes:
  latache-redis: